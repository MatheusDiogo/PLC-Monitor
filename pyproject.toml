[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-monitor"
version = "1.0.0"
description = "Monitor de CLPs — Prova Prática"
requires-python = ">=3.9"
dependencies = ["asyncua>=1.0", "pywebview>=5.0", "psutil>=5.9"]

[project.scripts]
plc-monitor = "plc_monitor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plc_monitor.web" = ["static/*"]
